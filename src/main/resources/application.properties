spring.application.name=Eventos_Escolares

# Configuración de la Base de Datos (Render)
spring.datasource.url=jdbc:postgresql://dpg-d5rluc6r433s738nvff0-a.frankfurt-postgres.render.com:5432/eventos_escolares
spring.datasource.username=user
spring.datasource.password=VXPgjRIknPUk6xcIzkL3J0dmNYNtD9Pu
spring.datasource.driver-class-name=org.postgresql.Driver

# Actualización automática de la tabla
spring.jpa.hibernate.ddl-auto=update

# Configuración de Errores
server.error.include-stacktrace=never
server.error.include-message=always

# --- CONFIGURACIÓN PARA SUBIDA DE FOTOS ---

# Aumentamos el límite de tamaño de las fotos (10MB es ideal para móviles)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Permitir que Spring maneje archivos estáticos externos (la carpeta uploads)
spring.web.resources.static-locations=file:uploads/,classpath:/static/



